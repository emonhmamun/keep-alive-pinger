# n8n Sandbox Keep-Alive
# Pings the n8n sandbox every 5 minutes to prevent Aliyun FC suspension.
# URL is stored as encrypted GitHub secret (N8N_PUBLIC_URL) — never hardcoded.
name: n8n Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping n8n sandbox
        env:
          N8N_PUBLIC_URL: ${{ secrets.N8N_PUBLIC_URL }}
        run: |
          if [ -z "$N8N_PUBLIC_URL" ]; then
            echo "N8N_PUBLIC_URL secret not set"
            exit 0
          fi
          RESPONSE=$(curl -s -m 10 -o /dev/null -w "%{http_code}" "$N8N_PUBLIC_URL/api/n8n-status" 2>/dev/null || echo "000")
          if [ "$RESPONSE" != "000" ]; then
            echo "✅ n8n ALIVE (HTTP $RESPONSE)"
          else
            echo "⚠️ n8n unreachable — ping sent, will wake up if suspended"
          fi
