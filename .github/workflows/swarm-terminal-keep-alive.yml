# ============================================================
# SWARM TERMINAL Keep-Alive — External Pinger (DIAGNOSTIC RUN)
# Temporary diagnostic build — measures where external pings stall.
# ============================================================
name: SWARM TERMINAL Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping SWARM TERMINAL sandbox
        env:
          PING_URL: ${{ secrets.SWARM_TERMINAL_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "Secret not set"
            exit 0
          fi
          SID="github-actions-pinger"
          echo "runner egress IP: $(curl -s -m 8 ifconfig.me || echo unknown)"
          echo "--- attempt 1: root + session id, 60s budget, full timing ---"
          curl -4 -s -m 60 --connect-timeout 10 -o /dev/null \
            -w "code=%{http_code} dns=%{time_namelookup}s conn=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n" \
            -H "x-session-id: $SID" "$PING_URL" || echo "curl exit code: $?"
          echo "--- attempt 2: keepalive-status + session id, 30s budget ---"
          curl -4 -s -m 30 --connect-timeout 10 -o /dev/null \
            -w "code=%{http_code} dns=%{time_namelookup}s conn=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n" \
            -H "x-session-id: $SID" "$PING_URL/api/keepalive-status" || echo "curl exit code: $?"
          echo "--- attempt 3: NO session header (gateway reachable at all?), verbose ---"
          curl -4 -s -v -m 15 --connect-timeout 8 -o /dev/null \
            -w "code=%{http_code} conn=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n" \
            "$PING_URL" 2>&1 | grep -E "Trying|Connected|SSL|HTTP|code=|error|timed|refused|curl exit" | head -15
          echo "--- attempt 4: root again (warm?), 30s budget ---"
          curl -4 -s -m 30 --connect-timeout 10 -o /dev/null \
            -w "code=%{http_code} dns=%{time_namelookup}s conn=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n" \
            -H "x-session-id: $SID" "$PING_URL" || echo "curl exit code: $?"
          echo "Done."
