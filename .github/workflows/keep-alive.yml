name: 24/7 Keep-Alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then exit 0; fi
          RESPONSE=$(curl -s -m 10 -o /dev/null -w "%{http_code}" "$PUBLIC_URL/api/system-health" 2>/dev/null || echo "000")
          if [ "$RESPONSE" != "000" ]; then echo "ALIVE"; else echo "DOWN"; fi
          curl -s -m 10 -o /dev/null "$PUBLIC_URL" 2>/dev/null || true
          echo "Done"
